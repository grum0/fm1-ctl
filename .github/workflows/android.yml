# SPDX-License-Identifier: GPL-3.0-or-later
# GEN-1 for Android: runs the engine's host test and the golden-output check, writes the preview MIDI files (the
# artifact "gen1-preview-midi"), reports the generators' size for a microcontroller, then builds the debug APK (the
# artifact "gen1-debug-apk").
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - 'app/gen.c'
      - 'app/gen.h'
      - 'app/gen_cad.h'
      - 'app/grids_tables.h'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Engine host test (clock, channels, arpeggiator, sequencer, settings)
        run: sh android/host-test/run.sh

      - name: Native functions and field ids agree between Kotlin and C
        run: sh android/tools/check.sh

      - name: Preview MIDI files (one per style, one track per part, Grumo's channels)
        run: |
          set -eu
          cd android/host-test
          cc -std=c11 -I../../app -O2 -Wall -Wextra -Werror -o build/render render.c
          mkdir -p ../../preview-midi
          ./build/render preview ../../preview-midi

      - uses: actions/upload-artifact@v4
        with:
          name: gen1-preview-midi
          path: preview-midi/*.mid
          if-no-files-found: error

      - name: Size of the generators on a microcontroller (estimate for the FM-1)
        run: sh android/tools/gen_size.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          set -eu
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: What is in the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E 'libgen1|classes.*dex|AndroidManifest'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|uses-feature|launchable"

      - uses: actions/upload-artifact@v4
        with:
          name: gen1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
