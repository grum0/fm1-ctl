# GEN-1 for Android: runs the engine's host test, then builds the debug APK (the artifact "gen1-debug-apk").
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - 'app/gen.c'
      - 'app/gen.h'
      - 'app/grids_tables.h'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Engine host test (clock, channels, arpeggiator, sequencer, settings)
        run: sh android/host-test/run.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          set -eu
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gen1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
